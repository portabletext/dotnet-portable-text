name: build-and-test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK from global.json (.NET 10, including the .NET 10 runtime)
          global-json-file: global.json
          # Installs the .NET 8 SDK for its runtime, which the net8.0 tests run on.
          # Renovate leaves this line alone, see renovate.json.
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --report-xunit-trx --results-directory "testresults"
      # Runs package validation
      - run: dotnet pack --configuration Release --no-build --output artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: testresults
          path: testresults
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
