name: nuget-push

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+**"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # SDK used to build, see global.json
          global-json-file: global.json
          # Runtime for the net8.0 tests
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore /p:Version=${{github.ref_name}}
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack --configuration Release /p:Version=${{github.ref_name}} --no-build --output .
      - run: dotnet nuget push PortableText.${{github.ref_name}}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
