name: nuget-push

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+**"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets NuGet/login exchange a GitHub OIDC token for a short-lived API key
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # SDK used to build, see global.json
          global-json-file: global.json
          # Runtime for the net8.0 tests
          dotnet-version: "8.0.x"
      # The version comes from VersionPrefix in PortableText.csproj. The tag must
      # match it, optionally with a prerelease suffix (e.g. 2.0.0 or 2.0.0-beta.1).
      - name: Check tag against VersionPrefix
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "::error::Tag '$tag' is not a valid version (expected X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi
          prefix="${BASH_REMATCH[1]}"
          suffix="${BASH_REMATCH[3]}"
          expected="$(dotnet msbuild src/PortableText -getProperty:VersionPrefix)"
          if [[ "$prefix" != "$expected" ]]; then
            echo "::error::Tag '$tag' does not match VersionPrefix '$expected' in src/PortableText/PortableText.csproj"
            exit 1
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore -p:VersionSuffix="$VERSION_SUFFIX"
        env:
          VERSION_SUFFIX: ${{ steps.version.outputs.suffix }}
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack --configuration Release --no-build -p:VersionSuffix="$VERSION_SUFFIX" --output artifacts
        env:
          VERSION_SUFFIX: ${{ steps.version.outputs.suffix }}
      # Trusted publishing, see https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org username (public), not an email address
          user: saasen
      # Short-lived key from the NuGet login step above, not a stored secret
      - run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
